name: CI/CD con Serveo

on:
  push:
    branches:
      - main

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar ESLint
        run: npx eslint .  # Este paso falla si ESLint encuentra errores

  test:
    needs: eslint  # Este paso depende de que el job 'eslint' pase correctamente
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar tests
        run: npm test

  docker-validation:
    needs: test  # Este paso depende de que el job 'test' pase correctamente
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Instalar Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io

      - name: Instalar Trivy
        run: |
          curl -sSL https://github.com/aquasecurity/trivy/releases/download/v0.31.3/trivy_0.31.3_Linux-64bit.tar.gz | tar xz -C /usr/local/bin

      - name: Construir imagen Docker
        run: docker build -t edeljose/api-basica1 .  # Construir la imagen Docker

      - name: Escanear imagen Docker con Trivy
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL edeljose/api-basica1  # Escaneo de vulnerabilidades

  build-and-deploy:
    needs: docker-validation  # Este paso depende de que el job 'docker-validation' pase correctamente
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Autenticarse en Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Construir imagen Docker
        run: docker build -t edeljose/api-basica1 .  # Construir la imagen Docker

      - name: Subir imagen a Docker Hub
        run: docker push edeljose/api-basica1  # Subir la imagen a Docker Hub

      - name: Hacer deploy a WSL vía Serveo con contraseña
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            docker pull edeljose/api-basica1
            docker stop api-basica1 || true
            docker rm api-basica1 || true
            docker run -d --name api-basica1 -p 3000:3000 edeljose/api-basica1

